# Zvingo — production compose file.
#
# Usage:
#   cp .env.production.example .env   # then fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See DEPLOYMENT.md for the full deployment guide (TLS certs, DNS, backups).
#
# Differences from the dev docker-compose.yml:
#   - no source-code volume mounts, no --reload
#   - Mongo auth enabled, Redis password required
#   - Mongo/Redis ports are NOT published to the host (internal network only)
#   - no sms-mock service (real Africa's Talking credentials required)
#   - nginx terminates TLS on 443 and redirects 80 -> 443
#   - merchant dashboard served at / via nginx

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # SINGLE worker, deliberately. The FastAPI lifespan binds the BinProto
    # UDP/TCP listeners on fixed ports and starts singleton background loops
    # (dispatch retry, scheduled-order release, alert monitor). A second worker
    # would fail to bind those ports and would run every loop a second time,
    # duplicating driver offers. Scale out with more backend containers behind
    # nginx, not with --workers.
    #
    # This mirrors the Dockerfile CMD but adds --forwarded-allow-ips: nginx
    # reaches the backend from a compose-network address, not 127.0.0.1, so
    # without it uvicorn ignores X-Forwarded-Proto and thinks every request is
    # plain HTTP. Port 8000 is never published to the host, so only nginx can
    # reach it and trusting any peer here is safe.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "*"
    environment:
      - ENVIRONMENT=production
      # ${VAR:?...} makes compose fail fast if a required secret is missing —
      # there are deliberately NO insecure defaults here.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — generate with `openssl rand -hex 32`}
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:?}:${MONGO_INITDB_ROOT_PASSWORD:?}@mongo:27017/${MONGODB_DB_NAME:-zvingo}?authSource=admin
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-zvingo}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      # Mock modes default to TRUE in app/config.py for local development, and
      # the production validator refuses to start while either is on. They must
      # be pinned false here or the container exits at boot.
      - PAYMENT_MOCK_MODE=${PAYMENT_MOCK_MODE:-false}
      - SMS_MOCK_MODE=${SMS_MOCK_MODE:-false}
      # SMS — Africa's Talking (live credentials; SMS_GATEWAY_URL is dev-mock only
      # and intentionally not set in production)
      - AFRICASTALKING_USERNAME=${AFRICASTALKING_USERNAME:?}
      - AFRICASTALKING_API_KEY=${AFRICASTALKING_API_KEY:?}
      # Payments — Paynow Zimbabwe
      - PAYNOW_INTEGRATION_ID=${PAYNOW_INTEGRATION_ID:?}
      - PAYNOW_INTEGRATION_KEY=${PAYNOW_INTEGRATION_KEY:?}
      - PAYNOW_RETURN_URL=${PAYNOW_RETURN_URL:?e.g. https://your-domain/payment/return}
      - PAYNOW_RESULT_URL=${PAYNOW_RESULT_URL:?e.g. https://your-domain/api/payment/webhook}
      # Public base URL used to build uploaded-image URLs (https://your-domain)
      - UPLOAD_BASE_URL=${UPLOAD_BASE_URL:?e.g. https://your-domain}
      # Push notifications — path inside the container (file is baked in by the
      # backend Dockerfile COPY, or mount your own below)
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-firebase-credentials.json}
      # Allowed browser origins. In production an empty value means NO origin
      # is allowed, so the dashboard would fail CORS on every request.
      - CORS_ORIGINS=${CORS_ORIGINS:?e.g. https://your-domain}
      # Observability — all optional, defaults match app/config.py
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - ALERTS_ENABLED=${ALERTS_ENABLED:-true}
      - ALERT_POLL_INTERVAL_SECONDS=${ALERT_POLL_INTERVAL_SECONDS:-300}
      - ALERT_STUCK_ORDER_MINUTES=${ALERT_STUCK_ORDER_MINUTES:-30}
      - ALERT_FAILED_PAYMENT_THRESHOLD=${ALERT_FAILED_PAYMENT_THRESHOLD:-5}
      # Scheduled order release
      - SCHEDULED_POLL_INTERVAL_SECONDS=${SCHEDULED_POLL_INTERVAL_SECONDS:-15}
      - SCHEDULED_DISPATCH_LEAD_MINUTES=${SCHEDULED_DISPATCH_LEAD_MINUTES:-15}
    ports:
      # BinProto telemetry listeners used directly by the driver app
      # (nginx only proxies HTTP; these bypass it by design)
      - "9090:9090/udp"
      - "9091:9091"
    volumes:
      # Persist uploaded images (served at /static/uploads/...) across rebuilds
      - backend_uploads:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  merchant-dashboard:
    build:
      context: ./merchant-dashboard
      # Next.js inlines NEXT_PUBLIC_* into the client bundle and resolves the
      # /api/* rewrite at BUILD time, so these must be passed as build args —
      # setting them at runtime has no effect. Without NEXT_PUBLIC_API_URL the
      # dashboard falls back to http://localhost:8000 for uploads, which in a
      # browser means the user's own machine.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?e.g. https://your-domain/api}
        # Server-side rewrite target: nginx on the compose network, never
        # localhost (that would be the dashboard container itself).
        API_PROXY_URL: ${API_PROXY_URL:-http://nginx:80}
        NEXT_PUBLIC_DEFAULT_RESTAURANT_LAT: ${NEXT_PUBLIC_DEFAULT_RESTAURANT_LAT:-}
        NEXT_PUBLIC_DEFAULT_RESTAURANT_LNG: ${NEXT_PUBLIC_DEFAULT_RESTAURANT_LNG:-}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # Not published to the host — reached only through nginx at /
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # TLS certificates — put fullchain.pem + privkey.pem here (or symlink from
      # certbot's live dir). See DEPLOYMENT.md "Obtain TLS certificates".
      - ./nginx/certs:/etc/nginx/certs:ro
      # Webroot shared with certbot for ACME http-01 renewals
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      merchant-dashboard:
        condition: service_started

  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?}
    # No `ports:` — Mongo is reachable only on the internal compose network.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # $$ escapes compose interpolation; the vars are expanded inside the container
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?} --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
    # No `ports:` — Redis is reachable only on the internal compose network.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
  backend_uploads:
  certbot_webroot:
