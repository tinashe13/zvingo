# Zvingo — merchant dashboard host (split deployment).
#
# Runs the Next.js dashboard behind its own nginx TLS terminator. It holds no
# database and no secrets beyond TLS certs: the browser talks to the API host
# directly using the URL baked in at build time.
#
# Usage:
#   cp .env.dashboard.example .env
#   # fill in every value, then:
#   docker compose -f docker-compose.dashboard.yml up -d --build
#
# The Next.js build needs ~1.5 GB of RAM. On a 1–2 GB droplet add swap first
# (see DEPLOYMENT.md "Build runs out of memory") or the kernel will kill it.

services:
  merchant-dashboard:
    build:
      context: ./merchant-dashboard
      # Next.js inlines NEXT_PUBLIC_* into the client bundle and resolves the
      # /api/* rewrite at BUILD time, so these must be build args — setting
      # them at runtime has no effect, and changing them needs a rebuild.
      args:
        # The API host, including the /api prefix. Without this the dashboard
        # sends uploads to http://localhost:8000 — the visitor's own machine.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?e.g. https://api.your-domain/api}
        # Server-side rewrite target. In a split deployment the browser calls
        # the API host directly, so this only matters for server-rendered
        # fetches; point it at the same public API host.
        API_PROXY_URL: ${API_PROXY_URL:-${NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_DEFAULT_RESTAURANT_LAT: ${NEXT_PUBLIC_DEFAULT_RESTAURANT_LAT:-}
        NEXT_PUBLIC_DEFAULT_RESTAURANT_LNG: ${NEXT_PUBLIC_DEFAULT_RESTAURANT_LNG:-}
        # Caps the V8 heap during `next build`. Lower it on a small droplet so
        # Node garbage-collects instead of being killed by the OOM reaper.
        NODE_BUILD_MEMORY_MB: ${NODE_BUILD_MEMORY_MB:-1536}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # Not published to the host — reached only through nginx at /
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dashboard.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      merchant-dashboard:
        condition: service_started

volumes:
  certbot_webroot:
