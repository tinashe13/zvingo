# Zvingo — nginx for the API host (split deployment).
# Mounted over /etc/nginx/nginx.conf by docker-compose.backend.yml.
#
# This host serves ONLY the backend. The merchant dashboard lives on its own
# host with nginx.dashboard.conf. See DEPLOYMENT.md "Split deployment".
#
# Routing scheme:
#   http://…            -> 301 https://…  (except ACME challenges)
#   https://…/api/*     -> backend:8000   (with the /api prefix stripped)
#   https://…/ws/*      -> backend:8000   (WebSockets: driver dispatch,
#                                          consumer order tracking)
#   https://…/static/*  -> backend:8000   (uploaded images, no prefix strip)
#   https://…/          -> 404            (nothing else is served here)
#
# The /api prefix is kept even though this is a dedicated api.* subdomain, so
# existing clients (which are built against https://api.<domain>/api) need no
# change. Drop it later if you want, but every app has to be rebuilt in step.
#
# TLS certificates are expected at /etc/nginx/certs/{fullchain,privkey}.pem.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Large enough for restaurant menu / profile image uploads
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8000;
    }

    # ------------------------------------------------------------------
    # Port 80 — ACME challenges + redirect everything else to HTTPS
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        # Replace with your real API domain
        server_name api.pindira.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # Port 443 — TLS termination
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        # Replace with your real API domain
        server_name api.pindira.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --------------------------------------------------------------
        # WebSockets — driver dispatch and consumer order tracking.
        # Must come before /api/ — longest-prefix match wins.
        # --------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --------------------------------------------------------------
        # SSE endpoints — long-lived streams, buffering must be off
        # --------------------------------------------------------------
        location /api/notification/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/location/driver/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # In-app order chat. A regex location so it wins over the generic
        # /api/ prefix block, which buffers and would freeze the stream.
        location ~ ^/api/chat/orders/[^/]+/stream$ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --------------------------------------------------------------
        # Prometheus metrics — internal only. Scrape from inside the
        # compose network at http://backend:8000/metrics instead.
        # --------------------------------------------------------------
        location = /api/metrics {
            deny all;
        }

        # --------------------------------------------------------------
        # REST API — /api prefix stripped before proxying to FastAPI.
        # CORS preflight is answered by FastAPI's CORSMiddleware, which is
        # why CORS_ORIGINS must list the dashboard origin on this host.
        # --------------------------------------------------------------
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
        }

        # --------------------------------------------------------------
        # Uploaded images — served by the backend at /static/uploads/…
        # UPLOAD_BASE_URL must point at THIS host so the URLs resolve.
        # --------------------------------------------------------------
        location /static/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
            # add_header in a location disables inheritance, so re-declare
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # Nothing else lives on the API host.
        location / {
            return 404;
        }
    }
}
