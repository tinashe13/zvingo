events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # WebSocket pub/sub endpoint for driver app (bidirectional)
        # Must come before the generic /api/ block (longest-prefix match wins)
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Long timeout — drivers stay connected for entire dash session
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SSE endpoint — needs special proxy settings for long-lived connections
        # Must come before the generic /api/ block since nginx matches longest prefix
        location /api/notification/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            # Disable buffering for SSE
            proxy_buffering off;
            proxy_cache off;
            # Long timeout for SSE streams (1 hour)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SSE endpoint for driver location tracking
        location /api/location/driver/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
        }

        location / {
            return 200 'OK';
            # In production, this would serve the Next.js frontend or a landing page
        }
    }
}
