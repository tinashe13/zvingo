# Zvingo — nginx for the merchant dashboard host (split deployment).
# Mounted over /etc/nginx/nginx.conf by docker-compose.dashboard.yml.
#
# This host serves ONLY the Next.js dashboard. It deliberately does NOT proxy
# /api: the browser talks to the API host directly, using the
# NEXT_PUBLIC_API_URL baked into the bundle at build time. That is why the
# backend's CORS_ORIGINS must list this host's origin.
#
# Routing scheme:
#   http://…  -> 301 https://…  (except ACME challenges)
#   https://… -> merchant-dashboard:3000
#
# TLS certificates are expected at /etc/nginx/certs/{fullchain,privkey}.pem.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    # Next.js uses a WebSocket for HMR in dev; harmless in production and
    # needed if you ever run the dev server behind this proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream dashboard {
        server merchant-dashboard:3000;
    }

    # ------------------------------------------------------------------
    # Port 80 — ACME challenges + redirect everything else to HTTPS
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        # Replace with your real dashboard domain
        server_name app.pindira.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # Port 443 — TLS termination
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        # Replace with your real dashboard domain
        server_name app.pindira.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Next.js build output is content-hashed and immutable.
        location /_next/static/ {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
