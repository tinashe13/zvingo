# Zvingo — production nginx config.
# Mounted over /etc/nginx/nginx.conf by docker-compose.prod.yml.
#
# Routing scheme:
#   http://…            -> 301 https://…  (except ACME challenges)
#   https://…/api/*     -> backend:8000   (with the /api prefix stripped)
#   https://…/ws/*      -> backend:8000   (WebSockets: driver dispatch channel
#                                        and consumer order tracking)
#   https://…/static/*  -> backend:8000   (uploaded images, no prefix strip)
#   https://…/*         -> merchant-dashboard:3000
#
# TLS certificates are expected at /etc/nginx/certs/{fullchain,privkey}.pem
# (bind-mounted from ./nginx/certs). To provision with certbot/Let's Encrypt:
#   sudo certbot certonly --standalone -d your-domain.example.com
#   cp /etc/letsencrypt/live/your-domain.example.com/{fullchain,privkey}.pem nginx/certs/
# Renewals can use the webroot at /var/www/certbot (shared certbot_webroot
# volume) — see DEPLOYMENT.md.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Large enough for restaurant menu / profile image uploads
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Map for WebSocket upgrade handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8000;
    }

    upstream dashboard {
        server merchant-dashboard:3000;
    }

    # ------------------------------------------------------------------
    # Port 80 — ACME challenges + redirect everything else to HTTPS
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        # Replace with your real domain
        server_name pindira.com;

        # Let's Encrypt http-01 renewal webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # Port 443 — TLS termination
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        # Replace with your real domain
        server_name pindira.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers ("always" so they are sent on error responses too)
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --------------------------------------------------------------
        # WebSocket endpoints (bidirectional, long-lived):
        #   /ws/driver/{driver_id}        app/dispatch/ws_router.py
        #   /ws/orders/{order_id}/track   app/tracking/ws_router.py
        # Must come before /api/ — longest-prefix match wins.
        # --------------------------------------------------------------
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Drivers stay connected for an entire dash session
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --------------------------------------------------------------
        # SSE endpoints — long-lived streams, buffering must be off
        # --------------------------------------------------------------
        location /api/notification/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SSE endpoint for driver location tracking
        location /api/location/driver/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SSE endpoint for in-app order chat
        # Backend route: /chat/orders/{order_id}/stream (app/chat/router.py).
        # A regex location so it wins over the generic /api/ prefix block,
        # which buffers and would leave the stream looking frozen.
        location ~ ^/api/chat/orders/[^/]+/stream$ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --------------------------------------------------------------
        # Prometheus metrics — internal only.
        # /metrics reports order, payment, and dispatch volumes, which is
        # business intelligence we do not publish. Scrape it from inside the
        # compose network (http://backend:8000/metrics) instead. Setting
        # METRICS_TOKEN in .env adds bearer auth on top of this.
        # --------------------------------------------------------------
        location = /api/metrics {
            deny all;
        }

        # --------------------------------------------------------------
        # REST API — /api prefix stripped before proxying to FastAPI
        # --------------------------------------------------------------
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
        }

        # --------------------------------------------------------------
        # Uploaded images — served by the backend at /static/uploads/…
        # (no prefix strip; UPLOAD_BASE_URL builds URLs on this path)
        # --------------------------------------------------------------
        location /static/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
            # add_header in a location disables inheritance of the server-level
            # headers, so re-declare the security headers here
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # --------------------------------------------------------------
        # Everything else — merchant dashboard (Next.js/Node on :3000)
        # --------------------------------------------------------------
        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
