name: driver_app
description: "Zvingo Driver App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.1

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI/Assets
  # NOTE: google_fonts was removed. 6.x does not compile on Flutter 3.47
  # (`FontWeight` const map keys lost their primitive `==`), and fetching
  # fonts over the network is the wrong trade-off for a driver app used on
  # patchy mobile data and offline. Typography now resolves through
  # AppTheme.fontFamily ('Inter', falling back to Roboto); bundle Inter as an
  # asset here to make the token literal.
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location
  geolocator: ^12.0.0

  # Real-time streaming (SSE kept for legacy; WebSocket pub/sub is primary)
  http: ^1.2.1
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
