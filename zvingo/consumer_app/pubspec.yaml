name: consumer_app
description: "Zvingo Consumer App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.1

  # Networking
  dio: ^5.4.3
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^6.0.3

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_client_sse: ^2.0.3

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # UI/Assets
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/
