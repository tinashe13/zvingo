plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing is read from android/key.properties (never committed — see
// android/.gitignore). When the file is absent (e.g. dev machines / CI without
// secrets), release tasks fail unless debug signing is explicitly opted into.
// See BUILD.md for setup.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def allowDebugReleaseSigning =
        project.findProperty('allowDebugReleaseSigning') == 'true' ||
        System.getenv('ZVINGO_ALLOW_DEBUG_RELEASE_SIGNING') == 'true'
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.zvingo.consumer_app"
    compileSdk = 35
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.zvingo.consumer_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : (allowDebugReleaseSigning ? signingConfigs.debug : null)
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestedRelease = graph.allTasks.any {
        it.name.toLowerCase().contains('release') &&
                (it.name.toLowerCase().contains('assemble') ||
                 it.name.toLowerCase().contains('bundle'))
    }
    if (requestedRelease && !keystorePropertiesFile.exists() && !allowDebugReleaseSigning) {
        throw new GradleException(
                'Release signing is not configured. Add android/key.properties ' +
                'or explicitly set -PallowDebugReleaseSigning=true for a non-deployable test build.')
    }
}

flutter {
    source = "../.."
}
